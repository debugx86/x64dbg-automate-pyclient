name: ci

on:
  push:
    branches: [main, "local.*"]
  pull_request:
  workflow_dispatch:
  schedule:
    # 每周一 03:30 UTC 跑一次 macOS 诊断腿（含 macOS 配额耗尽时也能在这里暴露）
    - cron: "30 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test / ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12", "3.13"]
        # macOS 不在每次 push 的矩阵里：它是私有仓库免费套餐下的稀缺资源
        # （2026-11-19 实测 local.19 / local.20 两次 push 的 macos-latest 腿
        # 排队整整 15 分钟都没拿到 runner 就被 cancelled：runner_name 为空、
        # steps 为空；local.18 同一条腿排了约 10 分钟后拿到 runner 并 36 s 跑完）。
        # macOS 兼容性诊断挪到下面的 macos 作业：定时（每周一）+ 手动 dispatch 触发，
        # 并且不阻塞闸门。

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package + test tooling
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[mcp]"
          python -m pip install pytest build twine

      # tests/conftest.py skips the integration suites when X64DBG_PATH is absent,
      # so this stays green on runners that have no debugger installed.
      - name: Unit tests
        shell: bash
        run: python -m pytest tests -q

      # ops/verify.py asserts on the installed layout (editable, not site-packages)
      # and exercises the local tool set against fake clients. Windows-only: the
      # assertions on console/launcher behaviour are meaningless elsewhere.
      - name: Offline patch verification
        if: runner.os == 'Windows'
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: python ops/verify.py

      - name: Build wheel + sdist
        shell: bash
        run: python -m build

      - name: Check distributions
        shell: bash
        run: python -m twine check dist/*

      - name: Import smoke test from the built wheel
        shell: bash
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -c "import x64dbg_automate as m; print(m.__file__); print('compat:', m.COMPAT_VERSION)"

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows' && matrix.python == '3.12'
        with:
          name: dist-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error

  # macOS 兼容诊断：只在定时 / 手动触发时跑，且不阻塞闸门（continue-on-error）。
  # 手动跑：gh workflow run ci.yml --ref <branch>
  macos:
    name: macos 诊断 / py3.13（不阻塞）
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    timeout-minutes: 25
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package + test tooling
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[mcp]"
          python -m pip install pytest build twine

      - name: Unit tests
        shell: bash
        run: python -m pytest tests -q

      - name: Build wheel + sdist
        shell: bash
        run: python -m build

      - name: Import smoke test from the built wheel
        shell: bash
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -c "import x64dbg_automate as m; print(m.__file__); print('compat:', m.COMPAT_VERSION)"

  # Single check to require in branch protection: the matrix above is what does
  # the work, this job just fails if any leg failed.
  ci:
    name: ci
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any matrix leg failed
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "matrix result: ${{ needs.test.result }}"
            exit 1
          fi
